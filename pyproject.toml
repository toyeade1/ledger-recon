[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledger-recon"
version = "0.1.0"
description = "A multi-step, tool-using RL environment for training LLM agents to reconcile multi-currency EMEA bank feeds."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Akintoye Adesomoju" }]
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.40"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["ledger_recon"]
